name: Tests

on:
  push:
    branches:
      - main
    paths: ["src/**", "tests/**"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["src/**", "tests/**"]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: 
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.4"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --locked --group=test --no-dev
      
      - name: Run tests with nox on ${{ matrix.os }}
        run: uv run nox -s "tests-${{ matrix.python-version }}"
